# 数据库连接（MyBatis 从这里拿连接，替代原来硬编码的 DBUtil）
spring.datasource.url=jdbc:mysql://localhost:3306/waimai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis：数据库下划线字段自动映射到 Java 驼峰属性（如 merchant_id -> merchantId）
mybatis.configuration.map-underscore-to-camel-case=true
